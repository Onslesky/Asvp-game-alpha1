<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ASVP Survivor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
html,body{
  margin:0;
  background:#050505;
  overflow:hidden;
  font-family:monospace;
  color:white;
  touch-action:none;
}
canvas{
  display:block;
  width:100vw;
  height:100vh;
  image-rendering:pixelated;
}
.screen{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#000c;
  z-index:10;
  text-align:center;
}
button{
  font-family:monospace;
  font-size:22px;
  padding:15px 25px;
  margin:10px;
  border:3px solid white;
  background:#111;
  color:white;
  border-radius:10px;
}
.card{
  border:3px solid white;
  padding:15px;
  margin:12px;
  background:#111d;
  width:260px;
}
.card img{
  max-width:160px;
  max-height:160px;
}
</style>
</head>

<body>

<div id="menu" class="screen">
  <h1>ASVP SURVIVOR</h1>
  <button onclick="showSelect()">START</button>
</div>

<div id="select" class="screen" style="display:none">
  <h1>CHOISIS TON ASVP</h1>

  <div class="card">
    <img src="Asvp 1 .PNG">
    <h2>ASVP 1</h2>
    <p>Vie normale<br>Vitesse normale</p>
    <button onclick="startGame(1)">CHOISIR</button>
  </div>

  <div class="card">
    <img src="Asvp 2.PNG">
    <h2>ASVP 2</h2>
    <p>Plus rapide<br>Moins de vie</p>
    <button onclick="startGame(2)">CHOISIR</button>
  </div>
</div>

<div id="levelup" class="screen" style="display:none">
  <h1>AMÉLIORATION</h1>
  <div id="choices"></div>
</div>

<canvas id="game"></canvas>
<audio id="music" src="Musique .mp3" loop></audio>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
  ctx.imageSmoothingEnabled=false;
}
resize();
addEventListener("resize",resize);

const ZOOM=0.8;

const MAP_W=4200;
const MAP_H=3200;
const GAME_MAX_TIME=360000;
const MAX_ZOMBIES=230;

const assets={};
const files={
  asvp1:"Asvp 1 .PNG",
  asvp2:"Asvp 2.PNG",
  map:"Map.PNG",
  flashball:"ArmeFlashball.PNG",
  kangou:"ArmeKangou.PNG",
  pet:"ArmePetTeddy.PNG",
  petFx:"EffectPetTeddy.PNG",
  crepe:"Crepe.PNG",
  crepeFx:"EffectCrepe.PNG",
  zLight:"ZombieLight.PNG",
  zMedium:"ZombieMedium.PNG",
  zHeavy:"ZombieHeavy .PNG"
};

for(const k in files){
  assets[k]=new Image();
  assets[k].src=files[k];
}

let running=false;
let startTime=0;
let selectedPlayer=1;

let player;
let zombies=[];
let bullets=[];
let effects=[];
let cars=[];

let level=1;
let xp=0;
let xpNeed=10;
let score=0;

let joy={active:false,x:0,y:0,dx:0,dy:0};
let keys={};

let weapons={
  flashball:{
    owned:true,
    name:"Flashball PM",
    dmg:22,
    cd:850,
    last:0,
    speed:8,
    level:1
  },
  crepe:{
    owned:false,
    name:"Crêpe bretonne",
    dmg:45,
    cd:3200,
    last:0,
    speed:5,
    level:0
  },
  pet:{
    owned:false,
    name:"Pet de Teddy",
    dmg:4,
    cd:5500,
    last:0,
    speed:4.5,
    level:0
  },
  kangou:{
    owned:false,
    name:"Kangou",
    dmg:999,
    cd:22000,
    last:0,
    level:0
  }
};

function showSelect(){
  document.getElementById("menu").style.display="none";
  document.getElementById("select").style.display="flex";
}

function startGame(choice){
  selectedPlayer=choice;

  if(choice===1){
    player={x:MAP_W/2,y:MAP_H/2,r:28,speed:3.2,hp:120,maxHp:120,img:assets.asvp1};
  }else{
    player={x:MAP_W/2,y:MAP_H/2,r:28,speed:4.1,hp:85,maxHp:85,img:assets.asvp2};
  }

  document.getElementById("select").style.display="none";

  const music=document.getElementById("music");
  music.volume=0.45;
  music.play().catch(()=>{});

  running=true;
  startTime=performance.now();
  requestAnimationFrame(loop);
}

function difficulty(now){
  return Math.min(1,(now-startTime)/GAME_MAX_TIME);
}

function cam(){
  const viewW=canvas.width/ZOOM;
  const viewH=canvas.height/ZOOM;

  return {
    x:player.x-viewW/2,
    y:player.y-viewH/2,
    w:viewW,
    h:viewH
  };
}

function screenX(x,c){return (x-c.x)*ZOOM}
function screenY(y,c){return (y-c.y)*ZOOM}

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function nearestZombie(){
  let best=null;
  let bd=999999;
  for(const z of zombies){
    const d=dist(player,z);
    if(d<bd){bd=d;best=z}
  }
  return best;
}

function spawnZombie(now){
  if(zombies.length>=MAX_ZOMBIES)return;

  const d=difficulty(now);
  const roll=Math.random();

  let type="light";
  if(d>0.25 && roll>0.65)type="medium";
  if(d>0.55 && roll>0.82)type="heavy";

  let side=Math.floor(Math.random()*4);
  let x,y;

  if(side===0){x=Math.random()*MAP_W;y=-120}
  if(side===1){x=MAP_W+120;y=Math.random()*MAP_H}
  if(side===2){x=Math.random()*MAP_W;y=MAP_H+120}
  if(side===3){x=-120;y=Math.random()*MAP_H}

  let hp,speed,r,img;

  if(type==="light"){
    hp=18+d*105;
    speed=0.75+d*1.25;
    r=24;
    img=assets.zLight;
  }

  if(type==="medium"){
    hp=35+d*190;
    speed=0.58+d*0.95;
    r=28;
    img=assets.zMedium;
  }

  if(type==="heavy"){
    hp=80+d*330;
    speed=0.38+d*0.65;
    r=34;
    img=assets.zHeavy;
  }

  zombies.push({
    x,y,type,img,r,
    hp,
    maxHp:hp,
    speed
  });
}

function damageZombie(z,dmg){
  z.hp-=dmg;
  if(z.hp<=0){
    zombies.splice(zombies.indexOf(z),1);
    xp++;
    score++;
    if(xp>=xpNeed)levelUp();
  }
}

function shoot(type,z,speed,dmg,r){
  let dx=z.x-player.x;
  let dy=z.y-player.y;
  let d=Math.hypot(dx,dy)||1;

  bullets.push({
    x:player.x,
    y:player.y,
    vx:dx/d*speed,
    vy:dy/d*speed,
    type,
    dmg,
    r,
    life:160
  });
}

function fireWeapons(now){
  const z=nearestZombie();

  if(z && now-weapons.flashball.last>weapons.flashball.cd){
    weapons.flashball.last=now;
    shoot("flashball",z,weapons.flashball.speed,weapons.flashball.dmg,10);
  }

  if(weapons.crepe.owned && z && now-weapons.crepe.last>weapons.crepe.cd){
    weapons.crepe.last=now;
    shoot("crepe",z,weapons.crepe.speed,weapons.crepe.dmg,14);
  }

  if(weapons.pet.owned && z && now-weapons.pet.last>weapons.pet.cd){
    weapons.pet.last=now;
    shoot("pet",z,weapons.pet.speed,weapons.pet.dmg,12);
  }

  if(weapons.kangou.owned && now-weapons.kangou.last>weapons.kangou.cd){
    weapons.kangou.last=now;
    spawnKangous();
  }
}

function spawnKangous(){
  const count=Math.min(15,weapons.kangou.level*3);

  for(let i=0;i<count;i++){
    const fromLeft=Math.random()<0.5;
    const y=(MAP_H/(count+1))*(i+1)+Math.random()*80-40;

    cars.push({
      x:fromLeft?-250:MAP_W+250,
      y,
      vx:fromLeft?12:-12,
      life:600,
      dmg:weapons.kangou.dmg
    });
  }
}

function levelUp(){
  running=false;
  level++;
  xp=0;
  xpNeed=Math.floor(xpNeed*1.32);

  const options=[];

  for(const key in weapons){
    const w=weapons[key];

    if(!w.owned && key!=="flashball"){
      options.push({
        text:"Nouvelle arme : "+w.name,
        action:()=>{
          w.owned=true;
          w.level=1;
        }
      });
    }

    if(w.owned){
      options.push({
        text:"+ Dégâts : "+w.name,
        action:()=>{
          w.dmg*=key==="kangou"?1.35:1.25;
          w.level++;
        }
      });

      options.push({
        text:"+ Vitesse attaque : "+w.name,
        action:()=>{
          w.cd=Math.max(250,w.cd*(key==="kangou"?0.9:0.85));
          w.level++;
        }
      });
    }
  }

  options.sort(()=>Math.random()-0.5);

  const div=document.getElementById("choices");
  div.innerHTML="";

  options.slice(0,3).forEach(o=>{
    const b=document.createElement("button");
    b.textContent=o.text;
    b.onclick=()=>{
      o.action();
      document.getElementById("levelup").style.display="none";
      running=true;
      requestAnimationFrame(loop);
    };
    div.appendChild(b);
  });

  document.getElementById("levelup").style.display="flex";
}

canvas.addEventListener("touchstart",e=>{
  const t=e.touches[0];
  joy.active=true;
  joy.x=t.clientX;
  joy.y=t.clientY;
});

canvas.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  joy.dx=t.clientX-joy.x;
  joy.dy=t.clientY-joy.y;
});

canvas.addEventListener("touchend",()=>{
  joy.active=false;
  joy.dx=0;
  joy.dy=0;
});

addEventListener("keydown",e=>keys[e.key]=true);
addEventListener("keyup",e=>keys[e.key]=false);

function update(now){
  const d=difficulty(now);

  const targetZombies=Math.floor(15+d*(MAX_ZOMBIES-15));
  const spawnChance=0.02+d*0.22;

  if(zombies.length<targetZombies && Math.random()<spawnChance){
    const amount=1+Math.floor(d*4);
    for(let i=0;i<amount;i++)spawnZombie(now);
  }

  let mx=0,my=0;

  if(keys.ArrowLeft||keys.q)mx=-1;
  if(keys.ArrowRight||keys.d)mx=1;
  if(keys.ArrowUp||keys.z)my=-1;
  if(keys.ArrowDown||keys.s)my=1;

  if(joy.active){
    mx=joy.dx/70;
    my=joy.dy/70;
  }

  const m=Math.hypot(mx,my)||1;
  player.x+=mx/m*player.speed;
  player.y+=my/m*player.speed;

  player.x=Math.max(80,Math.min(MAP_W-80,player.x));
  player.y=Math.max(80,Math.min(MAP_H-80,player.y));

  for(const z of zombies){
    const dx=player.x-z.x;
    const dy=player.y-z.y;
    const dd=Math.hypot(dx,dy)||1;

    z.x+=dx/dd*z.speed;
    z.y+=dy/dd*z.speed;

    if(dd<z.r+player.r){
      player.hp-=0.08+d*0.16;
    }
  }

  fireWeapons(now);

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx;
    b.y+=b.vy;
    b.life--;

    for(const z of [...zombies]){
      if(Math.hypot(b.x-z.x,b.y-z.y)<b.r+z.r){

        if(b.type==="flashball"){
          damageZombie(z,b.dmg);
        }

        if(b.type==="crepe"){
          effects.push({
            type:"crepeFx",
            x:b.x,
            y:b.y,
            r:105,
            life:32,
            dmg:b.dmg,
            hit:[]
          });
        }

        if(b.type==="pet"){
          effects.push({
            type:"petFx",
            x:b.x,
            y:b.y,
            r:120,
            life:300,
            dmg:b.dmg
          });
        }

        bullets.splice(i,1);
        break;
      }
    }

    if(b.life<=0)bullets.splice(i,1);
  }

  for(const e of effects){
    e.life--;

    if(e.type==="crepeFx"){
      for(const z of [...zombies]){
        if(!e.hit.includes(z) && Math.hypot(e.x-z.x,e.y-z.y)<e.r){
          damageZombie(z,e.dmg);
          e.hit.push(z);
        }
      }
    }

    if(e.type==="petFx"){
      for(const z of [...zombies]){
        if(Math.hypot(e.x-z.x,e.y-z.y)<e.r){
          damageZombie(z,e.dmg);
        }
      }
    }
  }

  effects=effects.filter(e=>e.life>0);

  for(const car of cars){
    car.x+=car.vx;
    car.life--;

    for(const z of [...zombies]){
      if(Math.abs(z.x-car.x)<135 && Math.abs(z.y-car.y)<55){
        damageZombie(z,car.dmg);
      }
    }
  }

  cars=cars.filter(c=>c.life>0 && c.x>-400 && c.x<MAP_W+400);

  if(player.hp<=0){
    running=false;
    alert("GAME OVER - Score : "+score);
    location.reload();
  }
}

function drawImg(image,x,y,w,h,c){
  if(!image.complete || image.naturalWidth===0)return;
  ctx.drawImage(
    image,
    screenX(x,c)-w*ZOOM/2,
    screenY(y,c)-h*ZOOM/2,
    w*ZOOM,
    h*ZOOM
  );
}

function drawMap(c){
  const map=assets.map;

  if(!map.complete || map.naturalWidth===0){
    ctx.fillStyle="#333";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    return;
  }

  const tile=900;

  const startX=Math.floor(c.x/tile)*tile-tile;
  const startY=Math.floor(c.y/tile)*tile-tile;
  const endX=c.x+c.w+tile;
  const endY=c.y+c.h+tile;

  for(let x=startX;x<endX;x+=tile){
    for(let y=startY;y<endY;y+=tile){
      ctx.drawImage(
        map,
        screenX(x,c),
        screenY(y,c),
        tile*ZOOM,
        tile*ZOOM
      );
    }
  }
}

function draw(){
  const c=cam();

  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawMap(c);

  for(const e of effects){
    if(e.type==="petFx"){
      drawImg(assets.petFx,e.x,e.y,220,220,c);
    }
    if(e.type==="crepeFx"){
      drawImg(assets.crepeFx,e.x,e.y,230,230,c);
    }
  }

  for(const car of cars){
    ctx.save();
    if(car.vx<0){
      ctx.translate(screenX(car.x,c),screenY(car.y,c));
      ctx.scale(-1,1);
      ctx.drawImage(assets.kangou,-120*ZOOM,-60*ZOOM,240*ZOOM,120*ZOOM);
    }else{
      drawImg(assets.kangou,car.x,car.y,240,120,c);
    }
    ctx.restore();
  }

  for(const z of zombies){
    drawImg(z.img,z.x,z.y,95,120,c);

    ctx.fillStyle="red";
    ctx.fillRect(screenX(z.x,c)-25*ZOOM,screenY(z.y,c)-70*ZOOM,50*ZOOM,5*ZOOM);
    ctx.fillStyle="lime";
    ctx.fillRect(screenX(z.x,c)-25*ZOOM,screenY(z.y,c)-70*ZOOM,50*ZOOM*(z.hp/z.maxHp),5*ZOOM);
  }

  for(const b of bullets){
    if(b.type==="flashball")drawImg(assets.flashball,b.x,b.y,55,35,c);
    if(b.type==="crepe")drawImg(assets.crepe,b.x,b.y,55,55,c);
    if(b.type==="pet")drawImg(assets.pet,b.x,b.y,55,55,c);
  }

  drawImg(player.img,player.x,player.y,120,150,c);

  ctx.fillStyle="white";
  ctx.font="18px monospace";

  const time=Math.floor((performance.now()-startTime)/1000);
  ctx.fillText("TIME "+time+"s  LVL "+level+"  XP "+xp+"/"+xpNeed+"  SCORE "+score,18,28);

  ctx.fillStyle="red";
  ctx.fillRect(18,40,150,10);
  ctx.fillStyle="lime";
  ctx.fillRect(18,40,150*(player.hp/player.maxHp),10);
}

function loop(now){
  if(!running)return;
  update(now);
  draw();
  requestAnimationFrame(loop);
}
</script>

</body>
</html>
